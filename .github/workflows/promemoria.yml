name: Promemoria diario

on:
  schedule:
    - cron: '*/15 * * * *'   # ogni 15 minuti (orario UTC, l'ora vera la decide ogni persona)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invia:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Installa web-push
        run: npm install --prefix scripts
      - name: Invia i promemoria
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: node scripts/invia-promemoria.js
